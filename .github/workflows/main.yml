name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Debug files
        run: |
          pwd
          ls -la
          echo "--- ZIP CONTENT ---"
          unzip -l FreeFireSensitivityHelper_Project.zip | head -n 100
          echo "--- EXTRACT ---"
          unzip -o FreeFireSensitivityHelper_Project.zip -d .
          echo "--- ALL FILES ---"
          find . -maxdepth 4 -type f | head -n 100
      - name: Build APK
        run: |
          PROJECT_DIR=$(find . -name "gradlew" | head -n 1 | xargs dirname)
          echo "Found gradlew in $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FreeFire-APK
          path: "**/app-debug.apk"
