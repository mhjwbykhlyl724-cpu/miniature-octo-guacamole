name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract and Build
        run: |
          ls -la
          if [ ! -f FreeFireSensitivityHelper_Project.zip ]; then echo "ZIP NOT FOUND!"; exit 1; fi
          unzip -o FreeFireSensitivityHelper_Project.zip -d .
          echo "--- FILES ---"
          find . -maxdepth 4 -type f | head -n 100
          PROJECT_DIR=$(find . -name "settings.gradle*" | head -n 1 | xargs dirname 2>/dev/null)
          if [ -z "$PROJECT_DIR" ]; then PROJECT_DIR=$(find . -name "gradlew" | head -n 1 | xargs dirname 2>/dev/null); fi
          if [ -z "$PROJECT_DIR" ]; then PROJECT_DIR=$(find . -name "build.gradle*" | head -n 1 | xargs dirname 2>/dev/null); fi
          if [ -z "$PROJECT_DIR" ]; then echo "NO ANDROID PROJECT FOUND IN ZIP"; exit 1; fi
          echo "PROJECT FOUND IN: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          ls -la
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew assembleDebug --stacktrace; else gradle assembleDebug --stacktrace; fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: FreeFire-APK
          path: "**/app-debug.apk"
